name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pip-audit pip-licenses
      - run: python -m pytest -q
      - run: python -m compileall -q api graph integrations memory models persistence tests
      - run: pip-audit -r requirements.txt --format json --output reports/pip-audit.json
      - run: pip-licenses --format=json --output-file reports/pip-licenses.json
      - run: python scripts/generate_dependency_reports.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-reports
          path: reports/

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: revenue-recovery-agent:${{ github.sha }}